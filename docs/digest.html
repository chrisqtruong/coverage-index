<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coverage Index: daily digest</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0f0c">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<style>
  .dg-list { list-style: none; margin: 0; padding: 0; counter-reset: n; border-top: 1px solid var(--rule); }
  .dg-list > li { padding: 12px 0; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 4.5ch minmax(0, 1fr); gap: 0 10px; }
  .dg-list .n { color: var(--green); text-align: right; }
  .dg-list h2 { margin: 0 0 4px; font-size: 19px; font-weight: 700; line-height: 1.3; }
  .dg-list h2 a { color: var(--ink); }
  .dg-list ul { list-style: none; margin: 4px 0 0; padding: 0; font-size: 15px; color: var(--dim); }
  .dg-list ul li { padding: 2px 0; }
  .dg-list ul b { color: var(--green); font-weight: 400; }
  .dg-list ul a { color: var(--dim); }
  pre { white-space: pre-wrap; font: 15px/1.5 var(--font); color: var(--ink); border-top: 1px solid var(--rule); padding-top: 12px; }
  .bar2 { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: baseline; padding: 12px 0 8px; color: var(--dim); }
  .bar2 button, .bar2 a { color: var(--green); }
  .bar2 select { background: var(--bg); color: var(--ink); border: 1px solid var(--rule); font: inherit; padding: 2px 4px; }
</style>
</head>
<body>
<header class="top">
  <h1><a href="./">Coverage Index</a></h1>
  <nav class="when" aria-label="Pages"><a href="./">today's news</a></nav>
</header>
<div class="bar2">
  <label>Digest for <select id="day" aria-label="Choose a day"></select></label>
  <button type="button" id="copy">copy as plain text</button>
  <a id="txt" href="#">open plain text</a>
  <button type="button" id="mode" aria-pressed="false">show plain text here</button>
  <span id="copied" aria-live="polite"></span>
</div>
<p class="summary" id="intro"></p>
<main><ol class="dg-list" id="list"></ol><pre id="plain" hidden></pre></main>
<footer class="foot"><p>Each digest is written automatically at 7am Eastern for the day before: the 20 events covered by the most outlets. A reprint of another outlet's story counts as the original outlet.</p></footer>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let META, TEXT = "";
async function load(day) {
  const [d, t] = await Promise.all([fetch(`data/digest/${day}.json`).then(r => r.json()), fetch(`data/digest/${day}.txt`).then(r => r.text())]);
  TEXT = t;
  const name = id => (META.outlets.find(o => o.id === id) || {}).name || id;
  const date = new Date(day + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  $("#intro").textContent = `${date}. The ${d.groups.length} events covered by the most outlets, out of ${d.outlets} outlets that published that day.`;
  $("#list").innerHTML = d.groups.map(g => `<li><span class="n">${g.n}</span><div><h2><a href="./#d=${day}&c=${encodeURIComponent(g.id)}">${esc(g.t)}</a></h2>` +
    `<ul>${g.s.map(x => `<li><b>${esc(name(x.o))}</b>: <a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.t)}</a>${x.rep ? ` <i>(reprint of ${esc(name(x.rep))})</i>` : ""}</li>`).join("")}</ul></div></li>`).join("");
  $("#plain").textContent = t;
  $("#txt").href = `data/digest/${day}.txt`;
  history.replaceState(null, "", "#" + day);
}
(async () => {
  const [index, meta] = await Promise.all([fetch("data/index.json", { cache: "no-cache" }).then(r => r.json()), fetch("data/meta.json").then(r => r.json())]);
  META = meta;
  const days = (index.digests || []).slice().reverse();
  if (!days.length) { $("#intro").textContent = "No digest yet. The first one is written at 7am Eastern the morning after the first full day of news."; return; }
  $("#day").innerHTML = days.map(d => `<option>${d}</option>`).join("");
  const want = location.hash.slice(1);
  $("#day").value = days.includes(want) ? want : days[0];
  $("#day").addEventListener("change", e => load(e.target.value));
  load($("#day").value);
})();
$("#copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(TEXT); $("#copied").textContent = "copied"; }
  catch (e) { $("#copied").textContent = "copy didn't work here; use 'open plain text' instead"; }
  setTimeout(() => $("#copied").textContent = "", 2500);
});
$("#mode").addEventListener("click", e => {
  const plain = e.target.getAttribute("aria-pressed") !== "true";
  e.target.setAttribute("aria-pressed", plain);
  e.target.textContent = plain ? "show formatted" : "show plain text here";
  $("#plain").hidden = !plain; $("#list").hidden = plain;
});
</script>
</body>
</html>
